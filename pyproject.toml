[project]
name = "ml-scratch"
version = "0.1.0"
description = "Machine learning algorithms implemented from scratch."
readme = "README.md"
authors = [
    { name = "LizPing", email = "13377139758@163.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]
